<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>گوبی‌ها</title>
<meta name="description" content="بازی ادغام گوبی‌ها — صفحه ۳×۳.">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#111;--paper:#fff;--bg:#0e0e1c;--panel:#1b1b2e;--gold:#f5c518;--purple:#7b5cff;--red:#e23b3b}
body{margin:0;font-family:Vazirmatn,Tahoma,Arial,sans-serif;background:radial-gradient(900px 500px at 50% -10%,#2a2350,#0e0e1c 60%);color:#fff;min-height:100vh;padding:16px 12px 40px}
.wrap{max-width:520px;margin:0 auto}
header{text-align:center;margin:6px 0 12px}
h1{font-size:28px;margin:0;line-height:1.3}
.hud{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.stat{background:var(--panel);border:1px solid #33335a;border-radius:14px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat small{color:#aab;font-size:11px}
.board-wrap{background:#fff;border:5px solid #000;border-radius:6px;padding:0;box-shadow:0 12px 40px rgba(0,0,0,.55);position:relative;overflow:hidden}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.cell{aspect-ratio:1/1;background:#fff;border:3px solid #000;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;user-select:none}
.cell svg,.cell img{width:100%;height:100%;display:block;object-fit:cover}
.cell.empty{cursor:default}
.cell.selected{outline:5px solid var(--gold);outline-offset:-5px;background:#fff8d6;z-index:2}
.cell.pop svg,.cell.pop img{animation:pop .28s ease}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.cell.merge svg,.cell.merge img{animation:merge .35s ease}
@keyframes merge{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-4deg)}100%{transform:scale(1)}}
.cell.shake{animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.float{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-weight:900;color:#0a7d2e;font-size:22px;text-shadow:0 2px 0 #fff;pointer-events:none;animation:rise .9s ease forwards;z-index:5}
@keyframes rise{from{opacity:1;top:35%}to{opacity:0;top:0%}}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
button{font-family:inherit;border:0;border-radius:999px;padding:11px 18px;font-size:15px;font-weight:700;cursor:pointer}
.btn-main{background:var(--gold);color:#111}
.btn-ghost{background:#2a2a44;color:#fff;border:1px solid #44446a}
.btn-danger{background:#e23b3b;color:#fff}
button:active{transform:scale(.97)}
.overlay{position:fixed;inset:0;background:rgba(5,5,15,.88);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.overlay .box{background:#fff;color:#111;border:5px solid #000;border-radius:20px;max-width:440px;width:100%;padding:22px;text-align:center;line-height:1.9}
.overlay .box h2{margin:0 0 8px;font-size:24px}
.overlay .box p{margin:8px 0;font-size:15px}
.overlay .box .big{font-size:42px}
.overlay .box button{margin-top:10px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🌙 گوبی‌ها</h1>
</header>

<div class="hud">
<div class="stat"><b id="score">۰</b><small>امتیاز</small></div>
<div class="stat"><b id="best">۰</b><small>بهترین</small></div>
</div>

<div class="board-wrap"><div class="board" id="board"></div></div>

<div class="controls">
<button class="btn-main" id="startBtn">▶ شروع</button>
<button class="btn-ghost" id="autoBtn">🎬 تماشا</button>
<button class="btn-ghost" id="soundBtn">🔊 صدا: روشن</button>
<button class="btn-danger" id="resetBtn">↺ از اول</button>
</div>


</div>

<div class="overlay" id="startOverlay"><div class="box">
<div class="big">🦭✨</div>
<h2>گوبی‌ها</h2>
<button class="btn-main" id="playBtn" style="font-size:18px;padding:14px 28px">▶ شروع کن</button>
<p style="font-size:13px;color:#555">برای شنیدن صدا، اول روی شروع بزن.</p>
</div></div>

<div class="overlay hidden" id="endOverlay"><div class="box">
<div class="big" id="endEmoji">😵</div>
<h2 id="endTitle">بازی تمام شد!</h2>
<p id="endText"></p>
<p>امتیاز: <b id="endScore">۰</b> • بهترین: <b id="endBest">۰</b></p>
<button class="btn-main" id="againBtn" style="font-size:17px;padding:13px 26px">↺ دوباره بازی کن</button>
</div></div>

];
const mergeAudio={};
function preloadMergeSounds(){
 MERGE_SOUNDS.forEach((s,i)=>{
   if(!s) return;
   if(!mergeAudio[s.file]){ const a=new Audio(s.file); a.preload="auto"; mergeAudio[s.file]=a; }
 });
}
function playMergeSound(newTier){
 if(!soundOn) return;
 const s=MERGE_SOUNDS[Math.min(Math.max(newTier,1),5)];
 if(!s) return;
 try{
   const a=mergeAudio[s.file]||new Audio(s.file);
   a.playbackRate=s.rate; a.currentTime=0;
   const p=a.play(); if(p&&p.catch) p.catch(()=>{});
 }catch(e){}
}
const sfx={
 /* merge(newTier): play ONLY the authentic "be" of the character just made */
 merge(newTier){ playMergeSound(newTier); }
};

/* ---------- board ---------- */
function render(){
 boardEl.innerHTML="";
 board.forEach((t,i)=>{
   const c=document.createElement("div"); c.className="cell"+(t===null?" empty":"")+(selected===i?" selected":"");
   c.dataset.i=i;
   if(t!==null){c.innerHTML=charArt(t); c.title=TIERS[t].name;}
   c.addEventListener("click",()=>onCell(i,c));
   boardEl.appendChild(c);
 });
 $("score").textContent=fa(score); $("best").textContent=fa(best);
}
function spawnInterval(){return Math.max(900,2000-merges*30);} // calm pace: a new goobie every ~2s at first, faster only as you merge more
function emptyCells(){return board.map((v,i)=>v===null?i:-1).filter(i=>i>=0);}
function spawnOne(){
 if(!running||over) return;
 const e=emptyCells(); if(!e.length){checkEnd(); return;}
 const i=e[Math.floor(Math.random()*e.length)];
 board[i]=(score>300&&Math.random()<.12)?1:0;
 render();
 const cell=boardEl.children[i]; if(cell) cell.classList.add("pop");

 checkEnd();
}
function hasMerge(){
 for(let i=0;i<9;i++) for(let j=i+1;j<9;j++) if(board[i]!==null&&board[i]===board[j]) return true;
 return false;
}
function checkEnd(){
 if(emptyCells().length===0&&!hasMerge()){endGame(false);}
}
function onCell(i,el){
 if(!running||over||autoMode) return; // in watch-only autoplay the player does not play — this is your game

 if(board[i]===null){ if(selected!==null){selected=null; render();} return; }
 if(selected===null){selected=i; render(); return;}
 if(selected===i){selected=null; render(); return;}
 if(board[selected]===board[i]){
   const tier=board[i], from=selected, to=i;
   board[to]=Math.min(tier+1,5); board[from]=null; selected=null;
   score+=TIERS[board[to]].pts; merges++;
   if(score>best){best=score; localStorage.setItem("goobies-best",String(best));}
   render();
   const cell=boardEl.children[to]; if(cell){cell.classList.add("merge"); const f=document.createElement("div"); f.className="float"; f.textContent="+"+fa(TIERS[board[to]].pts); cell.appendChild(f);}
   sfx.merge(board[to]);
   if(board[to]===5&&!won){won=true; setTimeout(()=>endGame(true),450);}
 }else{
   el.classList.add("shake"); const prev=boardEl.children[selected]; if(prev) prev.classList.add("shake");
   setTimeout(()=>{selected=null; render();},300);
 }
}
function startGame(){
 preloadMergeSounds();
 board=Array(9).fill(null); score=0; merges=0; selected=null; over=false; won=false; running=true; autoMode=false;
 if(autoTimer){clearInterval(autoTimer);autoTimer=null;}
 $("startOverlay").classList.add("hidden"); $("endOverlay").classList.add("hidden");
 $("startBtn").textContent="⏸ توقف"; $("autoBtn").textContent="🎬 تماشا";
 // seed: middle row first
 [3,4,5].forEach((idx,k)=>setTimeout(()=>{if(running&&board[idx]===null){board[idx]=0; render(); const c=boardEl.children[idx]; if(c)c.classList.add("pop");}},k*350));
 if(spawnTimer) clearInterval(spawnTimer);
 spawnTimer=setInterval(()=>{ if(spawnTimer) clearInterval(spawnTimer); spawnTimer=setInterval(spawnOne,spawnInterval()); spawnOne(); },spawnInterval());
 render();
}
function stopGame(){running=false; if(spawnTimer){clearInterval(spawnTimer);spawnTimer=null;} if(autoTimer){clearInterval(autoTimer);autoTimer=null;} autoMode=false; $("startBtn").textContent="▶ شروع"; $("autoBtn").textContent="🎬 تماشا";}
function endGame(win){
 over=true; running=false;
 if(spawnTimer){clearInterval(spawnTimer);spawnTimer=null;}
 if(autoTimer){clearInterval(autoTimer);autoTimer=null;}
 $("endEmoji").textContent=win?"🐻":"😵";
 $("endTitle").textContent=win?"🏆 فردی ساختی!":"بازی تمام شد!";
 $("endText").textContent=win?"دو فاکسی را ادغام کردی و فردی شد!":"صفحه پر شد و هیچ دو گوبی هم‌شکلی برای ادغام نماند.";
 $("endScore").textContent=fa(score); $("endBest").textContent=fa(best);
 $("endOverlay").classList.remove("hidden");
 $("startBtn").textContent="▶ شروع";
 if(win) playMergeSound(5); // Freddy merge sound, nothing else
}
function autoPlay(){

 if(autoMode){stopGame(); render(); return;}
 board=Array(9).fill(null); score=0; merges=0; selected=null; over=false; won=false; running=true; autoMode=true;
 $("startOverlay").classList.add("hidden"); $("endOverlay").classList.add("hidden");
 $("autoBtn").textContent="⏸ توقف تماشا"; $("startBtn").textContent="▶ شروع";
 render();
 autoTimer=setInterval(()=>{
   if(!autoMode) return;
   const e=emptyCells();
   const pairs=[]; for(let a=0;a<9;a++)for(let b=a+1;b<9;b++) if(board[a]!==null&&board[a]===board[b]) pairs.push([a,b]);
   // merge as soon as the board is nearly full (or full), so the watch mode
   // actually merges instead of sitting on a full board
   if(pairs.length&&(e.length<=2)){
     const [a,b]=pairs[Math.floor(Math.random()*pairs.length)]; const oldTier=board[b]; board[b]=Math.min(oldTier+1,5); board[a]=null; merges++; score+=TIERS[board[b]].pts; if(score>best){best=score; localStorage.setItem("goobies-best",String(best));} render(); sfx.merge(board[b]); return;
   }
   if(e.length){const i=e[Math.floor(Math.random()*e.length)]; board[i]=0; render(); const c=boardEl.children[i]; if(c)c.classList.add("pop"); return;}
   board=Array(9).fill(null); render();
 },1100); // only the merge moment makes a sound
}

/* ---------- wire up ---------- */
$("startBtn").addEventListener("click",()=>{ if(running&&!autoMode){stopGame();} else if(!running){startGame();} else {stopGame();} });
$("playBtn").addEventListener("click",startGame);
$("againBtn").addEventListener("click",startGame);
$("resetBtn").addEventListener("click",()=>{stopGame(); board=Array(9).fill(null); score=0; merges=0; selected=null; over=false; won=false; render();});
$("autoBtn").addEventListener("click",autoPlay);
$("soundBtn").addEventListener("click",()=>{soundOn=!soundOn; $("soundBtn").textContent=soundOn?"🔊 صدا: روشن":"🔇 صدا: خاموش"; if(soundOn) playMergeSound(1);});

preloadMergeSounds();
render();
</script>
